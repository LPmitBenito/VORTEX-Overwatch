plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// ---- Core logic tests -------------------------------------------------------------------------
// Pure-Java tests of dev.streetresmon.core (no Minecraft classes, no JUnit needed).
// They live in src/coreTest/java (NOT src/test/java: Gradle's default `test` task would expect JUnit tests there
// and fail with "did not discover any tests"). `gradle build` runs them through `check`.
sourceSets {
    coreTest {
        java.srcDir 'src/coreTest/java'
        compileClasspath = files(sourceSets.main.output)
        runtimeClasspath = files(output, sourceSets.main.output)
    }
}

tasks.register('coreTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free core logic tests'
    dependsOn tasks.named('classes'), tasks.named('coreTestClasses')
    classpath = sourceSets.coreTest.runtimeClasspath
    mainClass = 'dev.streetresmon.core.CoreTests'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn tasks.named('coreTest')
}
